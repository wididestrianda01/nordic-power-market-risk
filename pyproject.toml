[project]
name = "nordic-power-risk"
version = "0.1.0"
description = "Nordic power-market decision and risk system (SE3 day-ahead/imbalance/reserve)"
authors = [
    { name = "wididestrianda01", email = "wididestrianda01@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "evidently>=0.7.21",
    "highspy>=1.15.1",
    "holidays>=0.87",
    "lightgbm>=4.5",
    "mlflow>=3.15.1",
    "pandera[pandas]>=0.32.1",
    "pydantic-settings>=2.15.0",
    "pyomo>=6.10.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.16.2",
    "torch>=2.5",
    "typer>=0.27.1",
]

[project.scripts]
nordic-risk = "nordic_power_risk.cli:app"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.0.0",
    "matplotlib>=3.10.0",
    "mypy>=2.3.0",
    "pandas-stubs>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "responses>=0.26.2",
    "ruff>=0.16.2",
    "scipy-stubs>=1.18.0.1",
    "types-pyyaml>=6.0.12.20260724",
    "types-requests>=2.33.0.20260712",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
packages = ["nordic_power_risk"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lightgbm.*"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "evidently.*"
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = "pyomo.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nordic_power_risk --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/nordic_power_risk"]
