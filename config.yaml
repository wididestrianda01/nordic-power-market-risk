# Non-secret pipeline parameters. Frozen values from wayfinder decisions T08/T09 —
# change only by amending the source ticket, not ad hoc.

zone: SE3

windows:
  # T08: primary hourly spine, SvK CC BY 4.0, deep enough for the full forecast
  # benchmark ladder.
  primary:
    start: "2019-01-01"
    end: "2026-06-30"
  # T08: secondary 15-minute exhibit window, reserved for the thesis-bridge
  # chapter, not core training data.
  secondary:
    start: "2025-10-01"
    end: "2026-07-31"

duckdb_path: "data/p16.duckdb"
manifest_path: "data/manifest.json"

# T05: local-only MLOps stack, MLflow tracking with SQLite backend (no server).
mlflow_tracking_uri: "sqlite:///data/mlflow.db"
mlflow_experiment: "day-ahead-ladder"

# Phase 3 ticket 01: fixed 1 MW / 2 MWh study battery and energy-only objective.
optimizer:
  horizon_days: 1
  power_limit_mw: 1.0
  energy_capacity_mwh: 2.0
  one_way_efficiency: 0.9487
  initial_soc_mwh: 1.0
  terminal_value_eur_mwh: 30.0
  degradation_cost_eur_mwh: 15.0
